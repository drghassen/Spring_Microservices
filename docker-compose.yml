services:

  config-server:
    image: ${IMAGE_REPOSITORY_PREFIX:-ghassen_dridi}/config-server:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: config-server/Dockerfile
    container_name: config-server
    ports:
      - 8888:8888
    environment:
      JWT_SECRET: "${JWT_SECRET:?Set JWT_SECRET in .env or the shell before starting Docker Compose}"
    networks:
      - microservices

  discovery-service:
    image: ${IMAGE_REPOSITORY_PREFIX:-ghassen_dridi}/discovery-service:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: discovery-service/Dockerfile
    container_name: discovery-service
    ports:
      - 8761:8761
    environment:
      EUREKA_HOSTNAME_DISCOVERY: discovery-service
      EUREKA_ENABLE_SELF_PRESERVATION: "false"
      CONFIG_SERVER_URL: optional:configserver:http://config-server:8888
    networks:
      - microservices
    depends_on:
      config-server:
        condition: service_healthy

  gateway:
    image: ${IMAGE_REPOSITORY_PREFIX:-ghassen_dridi}/gateway:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: gateway/Dockerfile
    container_name: gateway
    ports:
      - 8222:8222
    environment:
      EUREKA_HOSTNAME_GATEWAY: gateway
      CONFIG_SERVER_URL: optional:configserver:http://config-server:8888
      EUREKA_DEFAULT_ZONE: http://discovery-service:8761/eureka
      JWT_SECRET: "${JWT_SECRET:?Set JWT_SECRET in .env or the shell before starting Docker Compose}"
    networks:
      - microservices
    depends_on:
      discovery-service:
        condition: service_healthy

  games-service:
    image: ${IMAGE_REPOSITORY_PREFIX:-ghassen_dridi}/games-service:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: games-service/Dockerfile
    container_name: games-service
    environment:
      DB_URL: jdbc:postgresql://ms_pg_sql:5432/steam
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      EUREKA_HOSTNAME_GAMES: games-service
      CONFIG_SERVER_URL: optional:configserver:http://config-server:8888
      EUREKA_DEFAULT_ZONE: http://discovery-service:8761/eureka
      UPLOADS_GAMES_DIR: /app/uploads/games
    volumes:
      - games-uploads:/app/uploads/games
    networks:
      - microservices
    depends_on:
      gateway:
        condition: service_healthy
      postgresql:
        condition: service_healthy

  library-service:
    image: ${IMAGE_REPOSITORY_PREFIX:-ghassen_dridi}/library-service:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: library-service/Dockerfile
    container_name: library-service
    environment:
      EUREKA_HOSTNAME_LIBRARY: library-service
      MONGO_HOST: mongo_db
      EUREKA_DEFAULT_ZONE: http://discovery-service:8761/eureka
      CONFIG_SERVER_URL: optional:configserver:http://config-server:8888
    networks:
      - microservices
    depends_on:
      gateway:
        condition: service_healthy
      mongodb:
        condition: service_healthy

  order-service:
    image: ${IMAGE_REPOSITORY_PREFIX:-ghassen_dridi}/order-service:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: order-service/Dockerfile
    container_name: order-service
    environment:
      USER_URL: http://gateway:8222/api/v1/users
      LIBRARY_URL: http://gateway:8222/api/v1/library
      GAMES_URL: http://gateway:8222/api/v1/games
      PAYMENT_URL: http://gateway:8222/api/v1/payments
      DB_URL: jdbc:postgresql://ms_pg_sql:5432/steam
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      EUREKA_HOSTNAME_ORDER: order-service
      EUREKA_DEFAULT_ZONE: http://discovery-service:8761/eureka
      CONFIG_SERVER_URL: optional:configserver:http://config-server:8888
    networks:
      - microservices
    depends_on:
      gateway:
        condition: service_healthy
      postgresql:
        condition: service_healthy

  payment-service:
    image: ${IMAGE_REPOSITORY_PREFIX:-ghassen_dridi}/payment-service:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: payment-service/Dockerfile
    container_name: payment-service
    environment:
      DB_URL: jdbc:postgresql://ms_pg_sql:5432/steam
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      EUREKA_HOSTNAME_PAYMENT: payment-service
      EUREKA_DEFAULT_ZONE: http://discovery-service:8761/eureka
      CONFIG_SERVER_URL: optional:configserver:http://config-server:8888
    networks:
      - microservices
    depends_on:
      gateway:
        condition: service_healthy
      postgresql:
        condition: service_healthy

  user-service:
    image: ${IMAGE_REPOSITORY_PREFIX:-ghassen_dridi}/user-service:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: user-service/Dockerfile
    container_name: user-service
    environment:
      LIBRARY_URL: http://gateway:8222/api/v1/library
      EUREKA_HOSTNAME_USER: user-service
      MONGO_HOST: mongo_db
      EUREKA_DEFAULT_ZONE: http://discovery-service:8761/eureka
      CONFIG_SERVER_URL: optional:configserver:http://config-server:8888
      UPLOADS_USER_DIR: /app/uploads/user
      JWT_SECRET: "${JWT_SECRET:?Set JWT_SECRET in .env or the shell before starting Docker Compose}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-}"
    volumes:
      - user-uploads:/app/uploads/user
    networks:
      - microservices
    depends_on:
      gateway:
        condition: service_healthy
      mongodb:
        condition: service_healthy

  client:
    image: ${IMAGE_REPOSITORY_PREFIX:-ghassen_dridi}/client:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: UI_Spring/Dockerfile
    container_name: client
    ports:
      - 80:8080
    networks:
      - microservices
    depends_on:
      - user-service

  sonarqube:
    image: sonarqube:latest
    container_name: sonarqube
    depends_on:
      postgresql:
        condition: service_healthy
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://ms_pg_sql:5432/sonar
      SONAR_JDBC_USERNAME: postgres
      SONAR_JDBC_PASSWORD: postgres
    ports:
      - "9000:9000"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    networks:
      - microservices

  mongodb:
    image: mongo
    container_name: mongo_db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - 27017:27017
    volumes:
      - mongo:/data
    environment:
      - MONGO_INITDB_ROOT_USERNAME=achraf
      - MONGO_INITDB_ROOT_PASSWORD=ladhari02
    networks:
      - microservices

  mongo-express:
    image: mongo-express
    container_name: mongo_express
    restart: always
    volumes:
      - mongo-express:/data
    ports:
      - 8081:8081
    environment:
      - ME_CONFIG_MONGODB_ADMINUSERNAME=achraf
      - ME_CONFIG_MONGODB_ADMINPASSWORD=ladhari02
      - ME_CONFIG_MONGODB_SERVER=mongodb
    networks:
      - microservices

  postgresql:
    container_name: ms_pg_sql
    image: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: steam
      PGDATA: /data/postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres:/data/postgres
    ports:
      - "5432:5432"
    networks:
      - microservices
    restart: unless-stopped

  pgadmin:
    container_name: ms_pgadmin
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-pgadmin4@pgadmin.org}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    volumes:
      - pgadmin:/var/lib/pgadmin
    ports:
      - "5050:80"
    networks:
      - microservices
    restart: unless-stopped

networks:
  microservices:
    driver: bridge

volumes:
  mongo:
  postgres:
  pgadmin:
  user-uploads:
  games-uploads:
  mongo-express:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
