eureka:
  instance:
    hostname: ${EUREKA_HOSTNAME_USER:user-service}
    prefer-ip-address: false
    instance-id: ${spring.application.name}:${HOSTNAME:${random.uuid}}
    non-secure-port: 80
    non-secure-port-enabled: true
    secure-port-enabled: false
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://discovery-service/eureka}

application:
  config:
    library-url: http://gateway/api/v1/library

spring:
  data:
    mongodb:
      uri: ${MONGO_URI}
      database: users
      auto-index-creation: ${MONGO_AUTO_INDEX_CREATION:false}
