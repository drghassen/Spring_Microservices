eureka:
  instance:
    hostname: ${EUREKA_HOSTNAME_GATEWAY:localhost}
  client:
    should-unregister-on-shutdown: true
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka}
server:
  port: 8222
spring:
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins:
              - ${CORS_ALLOWED_ORIGIN_LOCALHOST:http://localhost}
              - ${CORS_ALLOWED_ORIGIN_LOCALHOST_4200:http://localhost:4200}
              - ${CORS_ALLOWED_ORIGIN_LOOPBACK_4200:http://127.0.0.1:4200}
              - ${CORS_ALLOWED_ORIGIN_APP:http://172.23.19.172}
            allowedMethods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowedHeaders:
              - Authorization
              - Content-Type
              - Accept
              - Origin
              - X-Requested-With
            exposedHeaders:
              - Authorization
            allowCredentials: false
            maxAge: 3600

jwt:
  secret: ${JWT_SECRET}

roles:
  admin: ${ROLES_ADMIN:ADMIN}
  user: ${ROLES_USER:USER}

services:
  user-service:
    name: ${SERVICES_USER_NAME:user-service}
    uri: ${SERVICES_USER_URI:lb://user-service}

  payment-service:
    name: ${SERVICES_PAYMENT_NAME:payment-service}
    uri: ${SERVICES_PAYMENT_URI:lb://payment-service}

  order-service:
    name: ${SERVICES_ORDER_NAME:order-service}
    uri: ${SERVICES_ORDER_URI:lb://order-service}

  games-service:
    name: ${SERVICES_GAMES_NAME:games-service}
    uri: ${SERVICES_GAMES_URI:lb://games-service}

  library-service:
    name: ${SERVICES_LIBRARY_NAME:library-service}
    uri: ${SERVICES_LIBRARY_URI:lb://library-service}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost,http://localhost:4200,http://127.0.0.1:4200,http://172.23.19.172}

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus
  endpoint:
    health:
      show-details: always
