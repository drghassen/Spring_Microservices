eureka:
  instance:
    hostname: ${EUREKA_HOSTNAME_ORDER:order-service}
    prefer-ip-address: false
    instance-id: ${spring.application.name}:${HOSTNAME:${random.uuid}}
    non-secure-port: 80
    non-secure-port-enabled: true
    secure-port-enabled: false
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://discovery-service/eureka}

application:
  config:
    user-url: http://gateway/api/v1/users
    library-url: http://gateway/api/v1/library
    games-url: http://gateway/api/v1/games
    payment-url: http://gateway/api/v1/payments

spring:
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: false
