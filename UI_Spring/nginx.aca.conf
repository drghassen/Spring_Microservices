server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; font-src 'self' data: https://fonts.gstatic.com https://cdn.jsdelivr.net; img-src 'self' data: blob:; connect-src 'self' https://fonts.googleapis.com https://fonts.gstatic.com https://cdn.jsdelivr.net" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /api {
        return 308 /api/;
    }

    location ~ ^/(?:USER|GAMES|LIBRARY|ORDER|PAYMENT)-SERVICE(?:/|$) {
        return 404;
    }

    location /api/ {
        client_max_body_size 10m;

        # Appel de Gateway via l'ingress interne ACA.
        proxy_pass http://gateway;
        proxy_http_version 1.1;

        # $proxy_host doit identifier l'application cible ACA : gateway.
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;

        # ACA termine HTTPS et fournit ce header.
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

        proxy_set_header Authorization $http_authorization;
        proxy_intercept_errors off;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_proxied any;
    gzip_min_length 1024;
}