version: 2.1

setup: true

parameters:
  run_oidc_claims_audit:
    type: boolean
    default: false
  run_azure_oidc_audit:
    type: boolean
    default: false
  run_prowler_rg_scan:
    type: boolean
    default: false

orbs:
  continuation: circleci/continuation@2.0.1
  path-filtering: circleci/path-filtering@3.0.0

jobs:
  select-ci-workflows:
    executor: path-filtering/default
    environment:
      PIPELINE_BASE_REVISION: << pipeline.git.base_revision >>
      PIPELINE_REVISION: << pipeline.git.revision >>
    steps:
      - checkout:
          method: full
      - run:
          name: Select a safe Git comparison base
          command: |
            set -euo pipefail

            current_revision="$PIPELINE_REVISION"
            candidate_base="${PIPELINE_BASE_REVISION:-}"
            comparison_base=""
            force_both_workflows=false

            if [[ ! "$current_revision" =~ ^[0-9a-f]{40}$ ]] || \
              ! git cat-file -e "${current_revision}^{commit}"; then
              echo "Cannot verify the current pipeline revision; refusing to filter workflows." >&2
              exit 1
            fi

            if [[ "$candidate_base" =~ ^[0-9a-f]{40}$ ]]; then
              if ! git cat-file -e "${candidate_base}^{commit}" 2>/dev/null; then
                git fetch --no-tags origin "$candidate_base" || true
              fi

              if git cat-file -e "${candidate_base}^{commit}" 2>/dev/null && \
                [[ "$candidate_base" != "$current_revision" ]] && \
                git merge-base --is-ancestor "$candidate_base" "$current_revision"; then
                comparison_base="$candidate_base"
              else
                force_both_workflows=true
              fi
            else
              force_both_workflows=true
            fi

            if [[ "$force_both_workflows" == true ]]; then
              # The orb can safely compare the current commit with its parent,
              # while the next step deliberately overrides the result to run
              # both workflows when CircleCI cannot provide a trustworthy base.
              comparison_base="$current_revision"
            fi

            {
              printf 'export PATH_FILTER_BASE=%q\n' "$comparison_base"
              printf 'export PATH_FILTER_FORCE_BOTH=%q\n' "$force_both_workflows"
            } >> "$BASH_ENV"

            printf 'Path-filter base selected: %s\n' "$comparison_base"
            printf 'Fail-safe both workflows: %s\n' "$force_both_workflows"
      - path-filtering/set-parameters:
          base-revision: "$PATH_FILTER_BASE"
          same-base-run: true
          config-path: .circleci/continue-config.yml
          output-path: /tmp/pipeline-parameters.json
          mapping: |
            ACA/.* run_infrastructure_ci true
            [.]circleci/.* run_application_ci true
            [.]circleci/.* run_infrastructure_ci true
            ^(?!ACA/|[.]circleci/).* run_application_ci true
      - run:
          name: Fail safe when the Git base is ambiguous
          command: |
            if [[ "$PATH_FILTER_FORCE_BOTH" == true ]]; then
              jq -n '{
                run_application_ci: true,
                run_infrastructure_ci: true
              }' > /tmp/pipeline-parameters.json
              echo "Git comparison base is ambiguous; both workflows are enabled."
            fi
      - continuation/continue:
          configuration_path: .circleci/continue-config.yml
          parameters: /tmp/pipeline-parameters.json

  oidc-claims-audit:
    docker:
      - image: cimg/python:3.13.11
    steps:
      - run:
          name: Print selected non-sensitive CircleCI OIDC V2 claims
          command: |
            python3 - <<'PY'
            import base64
            import json
            import os

            token = os.environ.get("CIRCLE_OIDC_TOKEN_V2", "")
            if not token:
                raise SystemExit("CIRCLE_OIDC_TOKEN_V2 is unavailable for this job")

            try:
                payload = token.split(".", 2)[1]
                payload += "=" * (-len(payload) % 4)
                claims = json.loads(base64.urlsafe_b64decode(payload))
            except (IndexError, ValueError, json.JSONDecodeError) as error:
                raise SystemExit("Unable to decode the CircleCI OIDC V2 claims") from error

            claim_names = (
                "iss",
                "aud",
                "sub",
                "oidc.circleci.com/org-id",
                "oidc.circleci.com/project-id",
                "oidc.circleci.com/vcs-origin",
                "oidc.circleci.com/vcs-ref",
            )
            print(json.dumps({name: claims.get(name) for name in claim_names}, indent=2))
            PY

  azure-oidc-audit:
    docker:
      - image: cimg/azure:2025.01.1@sha256:c1a7a3997721cbcd4dd55e249e59c07e8cf94afb5c4ed263c8c536ddc34b2648
    steps:
      - checkout
      - run:
          name: Verify the injected CircleCI environment CLI for custom-audience OIDC
          command: |
            for required_command in az python3; do
              command -v "$required_command" >/dev/null 2>&1 || {
                printf '%s is missing from the pinned cimg/azure executor.\n' "$required_command" >&2
                exit 1
              }
            done
            source .circleci/scripts/lib/aca-deployment.sh
            aca_require_circleci_environment_cli
      - run:
          name: Validate Azure OIDC authentication and non-destructive permissions
          command: bash .circleci/scripts/azure-oidc-audit.sh

  prowler-rg-security-scan:
    machine: true
    resource_class: drghassen/sonar-vm
    working_directory: ~/project
    steps:
      - checkout:
          method: full
      - run:
          name: Validate the self-hosted Prowler runtime
          command: |
            set -euo pipefail

            for required_command in prowler az python3; do
              command -v "$required_command"
            done
            prowler_version="$(prowler --version)"
            printf 'Prowler version: %s\n' "$prowler_version"
            [[ "$prowler_version" == *'5.40.0'* ]] || {
              echo "Prowler 5.40.0 is required on the self-hosted runner." >&2
              exit 1
            }

            for required_variable in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID; do
              test -n "${!required_variable:-}" || {
                printf '%s is missing from the Azure CircleCI context.\n' \
                  "$required_variable" >&2
                exit 1
              }
            done

            source .circleci/scripts/lib/aca-deployment.sh
            command -v circleci || true
            command -v circleci-agent || true
            for circleci_candidate in circleci circleci-agent; do
              circleci_candidate_path="$(command -v "$circleci_candidate" 2>/dev/null || true)"
              if [[ -n "$circleci_candidate_path" ]] && \
                aca_circleci_environment_cli_supports_custom_audience \
                  "$circleci_candidate_path"; then
                printf '%s custom-audience OIDC capability: supported\n' \
                  "$circleci_candidate"
              else
                printf '%s custom-audience OIDC capability: unsupported\n' \
                  "$circleci_candidate"
              fi
            done
            aca_require_circleci_environment_cli
      - run:
          name: Scan Azure and prepare the validated Prowler workspace bundle
          command: |
            set -euo pipefail
            umask 077

            source .circleci/scripts/lib/aca-deployment.sh
            aca_authenticate_with_circleci_oidc

            az account show --output none --only-show-errors
            az resource list \
              --subscription "$AZURE_SUBSCRIPTION_ID" \
              --output none \
              --only-show-errors

            scan_report_root="$(mktemp -d)"
            trap 'rm -rf -- "$scan_report_root"' EXIT
            PROWLER_REPORT_ROOT="$scan_report_root" \
              bash security/prowler/run-scheduled-rg-scan.sh --no-defectdojo

            mapfile -d '' filtered_csv_files < <(
              find "$scan_report_root" -type f \
                -path '*/internship_proxym/prowler-internship-proxym.csv' -print0
            )
            if ((${#filtered_csv_files[@]} != 1)); then
              printf 'Expected exactly one filtered Prowler CSV, found %s.\n' \
                "${#filtered_csv_files[@]}" >&2
              exit 1
            fi
            filtered_csv="${filtered_csv_files[0]}"
            metadata="${filtered_csv%/*}/metadata.json"
            test -s "$filtered_csv" && test -s "$metadata" || {
              echo "The filtered Prowler report or metadata is missing." >&2
              exit 1
            }

            workspace_directory="$PWD/.circleci-workspace/prowler"
            test ! -e "$PWD/.circleci-workspace" || {
              echo "Refusing to reuse an existing Prowler workspace directory." >&2
              exit 1
            }
            mkdir -p "$workspace_directory"
            install -m 600 "$filtered_csv" \
              "$workspace_directory/prowler-internship-proxym.csv"
            install -m 600 "$metadata" "$workspace_directory/metadata.json"

            python3 - \
              "$workspace_directory/prowler-internship-proxym.csv" \
              "$workspace_directory/metadata.json" \
              "$workspace_directory/manifest.json" \<<'PY'
            import hashlib
            import json
            import sys
            from pathlib import Path

            csv_path, metadata_path, manifest_path = map(Path, sys.argv[1:])
            with metadata_path.open(encoding="utf-8") as metadata_file:
                metadata = json.load(metadata_file)

            def sha256(path):
                digest = hashlib.sha256()
                with path.open("rb") as source:
                    for chunk in iter(lambda: source.read(1024 * 1024), b""):
                        digest.update(chunk)
                return digest.hexdigest()

            status = metadata["filtered_status_counts"]
            severity = metadata["severity_counts"]
            manifest = {
                "subscription_id": metadata["subscription_id"],
                "resource_group": metadata["resource_group"],
                "scan_timestamp": metadata["timestamp"],
                "finding_counts": {
                    "total": metadata["filtered_rg_finding_count"],
                    "pass": status["pass"],
                    "fail": status["fail"],
                    "critical": severity["critical"],
                    "high": severity["high"],
                    "medium": severity["medium"],
                    "low": severity["low"],
                },
                "sha256": {
                    "prowler-internship-proxym.csv": sha256(csv_path),
                    "metadata.json": sha256(metadata_path),
                },
            }
            with manifest_path.open("x", encoding="utf-8") as manifest_file:
                json.dump(manifest, manifest_file, indent=2, sort_keys=True)
                manifest_file.write("\n")

            expected_files = {
                "manifest.json",
                "metadata.json",
                "prowler-internship-proxym.csv",
            }
            if {path.name for path in manifest_path.parent.iterdir()} != expected_files:
                raise SystemExit("The Prowler workspace bundle contains unexpected files")
            print(f"Prepared Prowler workspace bundle for {manifest['scan_timestamp']}")
            PY
      - persist_to_workspace:
          root: .circleci-workspace
          paths:
            - prowler

  publish-prowler-defectdojo:
    machine: true
    resource_class: drghassen/sonar-vm
    working_directory: ~/project
    steps:
      - checkout:
          method: full
      - attach_workspace:
          at: .circleci-workspace
      - run:
          name: Validate and publish the filtered Prowler report
          command: |
            set -euo pipefail

            bash security/prowler/publish-defectdojo.sh \
              --csv .circleci-workspace/prowler/prowler-internship-proxym.csv \
              --metadata .circleci-workspace/prowler/metadata.json \
              --manifest .circleci-workspace/prowler/manifest.json

workflows:
  setup-path-filtering:
    when:
      and:
        - not: << pipeline.parameters.run_oidc_claims_audit >>
        - not: << pipeline.parameters.run_azure_oidc_audit >>
        - not: << pipeline.parameters.run_prowler_rg_scan >>
    jobs:
      - select-ci-workflows

  oidc-claims-audit:
    when:
      and:
        - << pipeline.parameters.run_oidc_claims_audit >>
        - not: << pipeline.parameters.run_azure_oidc_audit >>
        - not: << pipeline.parameters.run_prowler_rg_scan >>
    jobs:
      - oidc-claims-audit:
          filters:
            branches:
              only: master

  azure-oidc-audit:
    when:
      and:
        - << pipeline.parameters.run_azure_oidc_audit >>
        - not: << pipeline.parameters.run_oidc_claims_audit >>
        - not: << pipeline.parameters.run_prowler_rg_scan >>
    jobs:
      - azure-oidc-audit:
          context:
            - aca-deploy
          filters:
            branches:
              only: master

  prowler-rg-security-scan:
    when:
      and:
        - << pipeline.parameters.run_prowler_rg_scan >>
        - not: << pipeline.parameters.run_oidc_claims_audit >>
        - not: << pipeline.parameters.run_azure_oidc_audit >>
    jobs:
      - prowler-rg-security-scan:
          context:
            - aca-deploy
          filters:
            branches:
              only: master
      - publish-prowler-defectdojo:
          context:
            - prowler-security
          requires:
            - prowler-rg-security-scan
          filters:
            branches:
              only: master
