version: 2.1

setup: true

parameters:
  run_oidc_claims_audit:
    type: boolean
    default: false
  run_azure_oidc_audit:
    type: boolean
    default: false

orbs:
  continuation: circleci/continuation@2.0.1
  path-filtering: circleci/path-filtering@3.0.0

jobs:
  select-ci-workflows:
    executor: path-filtering/default
    environment:
      PIPELINE_BASE_REVISION: << pipeline.git.base_revision >>
      PIPELINE_REVISION: << pipeline.git.revision >>
    steps:
      - checkout:
          method: full
      - run:
          name: Select a safe Git comparison base
          command: |
            set -euo pipefail

            current_revision="$PIPELINE_REVISION"
            candidate_base="${PIPELINE_BASE_REVISION:-}"
            comparison_base=""
            force_both_workflows=false

            if [[ ! "$current_revision" =~ ^[0-9a-f]{40}$ ]] || \
              ! git cat-file -e "${current_revision}^{commit}"; then
              echo "Cannot verify the current pipeline revision; refusing to filter workflows." >&2
              exit 1
            fi

            if [[ "$candidate_base" =~ ^[0-9a-f]{40}$ ]]; then
              if ! git cat-file -e "${candidate_base}^{commit}" 2>/dev/null; then
                git fetch --no-tags origin "$candidate_base" || true
              fi

              if git cat-file -e "${candidate_base}^{commit}" 2>/dev/null && \
                [[ "$candidate_base" != "$current_revision" ]] && \
                git merge-base --is-ancestor "$candidate_base" "$current_revision"; then
                comparison_base="$candidate_base"
              else
                force_both_workflows=true
              fi
            else
              force_both_workflows=true
            fi

            if [[ "$force_both_workflows" == true ]]; then
              # The orb can safely compare the current commit with its parent,
              # while the next step deliberately overrides the result to run
              # both workflows when CircleCI cannot provide a trustworthy base.
              comparison_base="$current_revision"
            fi

            {
              printf 'export PATH_FILTER_BASE=%q\n' "$comparison_base"
              printf 'export PATH_FILTER_FORCE_BOTH=%q\n' "$force_both_workflows"
            } >> "$BASH_ENV"

            printf 'Path-filter base selected: %s\n' "$comparison_base"
            printf 'Fail-safe both workflows: %s\n' "$force_both_workflows"
      - path-filtering/set-parameters:
          base-revision: "$PATH_FILTER_BASE"
          same-base-run: true
          config-path: .circleci/continue-config.yml
          output-path: /tmp/pipeline-parameters.json
          mapping: |
            ACA/.* run_infrastructure_ci true
            [.]circleci/.* run_application_ci true
            [.]circleci/.* run_infrastructure_ci true
            ^(?!ACA/|[.]circleci/).* run_application_ci true
      - run:
          name: Fail safe when the Git base is ambiguous
          command: |
            if [[ "$PATH_FILTER_FORCE_BOTH" == true ]]; then
              jq -n '{
                run_application_ci: true,
                run_infrastructure_ci: true
              }' > /tmp/pipeline-parameters.json
              echo "Git comparison base is ambiguous; both workflows are enabled."
            fi
      - continuation/continue:
          configuration_path: .circleci/continue-config.yml
          parameters: /tmp/pipeline-parameters.json

  oidc-claims-audit:
    docker:
      - image: cimg/python:3.13.11
    steps:
      - run:
          name: Print selected non-sensitive CircleCI OIDC V2 claims
          command: |
            python3 - <<'PY'
            import base64
            import json
            import os

            token = os.environ.get("CIRCLE_OIDC_TOKEN_V2", "")
            if not token:
                raise SystemExit("CIRCLE_OIDC_TOKEN_V2 is unavailable for this job")

            try:
                payload = token.split(".", 2)[1]
                payload += "=" * (-len(payload) % 4)
                claims = json.loads(base64.urlsafe_b64decode(payload))
            except (IndexError, ValueError, json.JSONDecodeError) as error:
                raise SystemExit("Unable to decode the CircleCI OIDC V2 claims") from error

            claim_names = (
                "iss",
                "aud",
                "sub",
                "oidc.circleci.com/org-id",
                "oidc.circleci.com/project-id",
                "oidc.circleci.com/vcs-origin",
                "oidc.circleci.com/vcs-ref",
            )
            print(json.dumps({name: claims.get(name) for name in claim_names}, indent=2))
            PY

  azure-oidc-audit:
    docker:
      - image: cimg/azure:2025.01.1@sha256:c1a7a3997721cbcd4dd55e249e59c07e8cf94afb5c4ed263c8c536ddc34b2648
    steps:
      - checkout
      - run:
          name: Install pinned CircleCI CLI for custom-audience OIDC
          command: |
            readonly circleci_version="1.0.48773"
            readonly circleci_archive="circleci-cli_${circleci_version}_linux_amd64.tar.gz"
            readonly circleci_sha256="667d20cf172e1f263c37c106e0a7a3fdd64f9a4a6ac0fae1acbe1b16e8412972"

            for required_command in az curl python3 tar sha256sum; do
              command -v "$required_command" >/dev/null 2>&1 || {
                printf '%s is missing from the pinned cimg/azure executor.\n' "$required_command" >&2
                exit 1
              }
            done
            curl --fail --location --silent --show-error \
              --output "/tmp/${circleci_archive}" \
              "https://github.com/CircleCI-Public/circleci-cli/releases/download/v${circleci_version}/${circleci_archive}"
            printf '%s  %s\n' "$circleci_sha256" "/tmp/${circleci_archive}" \
              | sha256sum --check
            tar -xzf "/tmp/${circleci_archive}" -C /tmp circleci
            sudo install -m 0755 /tmp/circleci /usr/local/bin/circleci
            circleci version
      - run:
          name: Validate Azure OIDC authentication and non-destructive permissions
          command: bash .circleci/scripts/azure-oidc-audit.sh

workflows:
  setup-path-filtering:
    when:
      and:
        - not: << pipeline.parameters.run_oidc_claims_audit >>
        - not: << pipeline.parameters.run_azure_oidc_audit >>
    jobs:
      - select-ci-workflows

  oidc-claims-audit:
    when:
      and:
        - << pipeline.parameters.run_oidc_claims_audit >>
        - not: << pipeline.parameters.run_azure_oidc_audit >>
    jobs:
      - oidc-claims-audit:
          filters:
            branches:
              only: master

  azure-oidc-audit:
    when:
      and:
        - << pipeline.parameters.run_azure_oidc_audit >>
        - not: << pipeline.parameters.run_oidc_claims_audit >>
    jobs:
      - azure-oidc-audit:
          context:
            - aca-deploy
          filters:
            branches:
              only: master
