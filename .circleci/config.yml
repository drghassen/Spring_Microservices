version: 2.1

commands:
  qualify-application-images:
    description: Build, scan, exercise and optionally publish one immutable set of application images.
    parameters:
      publish_images:
        type: boolean
        default: false
    steps:
      - run:
          name: Build, secure, test and optionally publish application images
          command: |
            PUBLISH_IMAGES="<< parameters.publish_images >>" \
              bash .circleci/scripts/qualify-application-images.sh

jobs:
  filesystem-security-scan:
    docker:
      - image: aquasec/trivy:0.73.0
        entrypoint: /bin/sh
    working_directory: ~/project
    steps:
      - checkout
      - run:
          name: Scan source, secrets and IaC with Trivy
          command: sh .circleci/scripts/scan-filesystem.sh
      - store_artifacts:
          path: reports/trivy-filesystem.json
          destination: trivy/trivy-filesystem.json

  backend-quality:
    machine: true
    resource_class: drghassen/sonar-vm
    working_directory: ~/project
    steps:
      - checkout
      - restore_cache:
          keys:
            - maven-v2-{{ checksum "pom.xml" }}
            - maven-v2-
      - run:
          name: Compile, test, analyse SonarQube and wait for its quality gate
          command: bash .circleci/scripts/backend-quality.sh
      - save_cache:
          key: maven-v2-{{ checksum "pom.xml" }}
          paths:
            - ~/.m2/repository
      - store_test_results:
          path: .

  frontend-quality:
    docker:
      - image: cimg/node:22.16-browsers
    working_directory: ~/project
    steps:
      - checkout
      - restore_cache:
          keys:
            - npm-v2-{{ checksum "UI_Spring/package-lock.json" }}
            - npm-v2-
      - run:
          name: Install, test and build the Angular frontend
          command: bash .circleci/scripts/frontend-quality.sh
      - save_cache:
          key: npm-v2-{{ checksum "UI_Spring/package-lock.json" }}
          paths:
            - ~/.npm

  container-qualification:
    machine:
      image: ubuntu-2404:current
      docker_layer_caching: true
    resource_class: medium
    working_directory: ~/project
    steps:
      - checkout
      - qualify-application-images:
          publish_images: false
      - store_artifacts:
          path: reports
          destination: reports

  release-acr:
    machine:
      image: ubuntu-2404:current
      docker_layer_caching: true
    resource_class: medium
    working_directory: ~/project
    steps:
      - checkout
      - qualify-application-images:
          publish_images: true
      - store_artifacts:
          path: reports
          destination: reports

workflows:
  ci:
    jobs:
      - filesystem-security-scan
      - backend-quality:
          context:
            - sonarqube
      - frontend-quality
      - container-qualification:
          requires:
            - filesystem-security-scan
            - backend-quality
            - frontend-quality
          filters:
            branches:
              ignore: master
      - release-acr:
          context:
            - acr-publish
          requires:
            - filesystem-security-scan
            - backend-quality
            - frontend-quality
          filters:
            branches:
              only: master
