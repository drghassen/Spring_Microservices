spring:
  config:
    import: ${CONFIG_SERVER_URL:optional:configserver:http://config-server:8888}
  application:
    name: gateway
  data:
    redis:
      host: localhost
      port: 6379

server:
  port: 8020

jwt:
  secret: 413F4428472B4BB6250655368566D5970337336763979244226452948404D6351

roles:
  admin: ADMIN
  user: USER

rate-limit:
  auth:
    replenish-rate: 5
    burst-capacity: 10

ip-blocking:
  mode: SHADOW
  window:
    duration: 10s
    rate-limit-429-threshold: 3
    abusive-windows-required: 3
  block:
    duration: 60s

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState
        redis:
          include: redis

services:
  user-service:
    name: user-service
    uri: http://localhost:8081

  payment-service:
    name: payment-service
    uri: http://localhost:8085

  order-service:
    name: order-service
    uri: http://localhost:8083

  games-service:
    name: games-service
    uri: http://localhost:8082

  library-service:
    name: library-service
    uri: http://localhost:8084
